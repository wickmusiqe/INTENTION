<style>
:root{--bg:#f6f5f1;--fg:#0b0b0b;--mute:#8a8a85;--line:#dcdad3;--green:#1fd15b;--red:#ee3b3b;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--fg:#f2f1ec;--mute:#7d7d78;--line:#262624;--card:#151514}}
:root[data-theme="dark"]{--bg:#0b0b0b;--fg:#f2f1ec;--mute:#7d7d78;--line:#262624;--card:#151514}
:root{--acc:#dc3534}
:root[data-theme="wick"]{--bg:#0000ff;--fg:#fff;--mute:rgba(255,255,255,.62);--line:rgba(255,255,255,.28);--card:#0a0ae0;--red:#fd7702;--acc:#fd7702;color-scheme:dark}
:root[data-theme="lime"]{--bg:#a6fd00;--fg:#111900;--mute:rgba(17,25,0,.6);--line:rgba(17,25,0,.26);--card:#9aeb00;--red:#3b6e00;--acc:#3b6e00;--hglow:rgba(17,25,0,.3);color-scheme:light}
:root[data-theme="lime"] .bar,:root[data-theme="lime"] .ybar{background:#9aeb00}
:root[data-theme="lime"] .dot{--gc:rgba(59,110,0,.8)}
:root[data-theme="wick"] .bar,:root[data-theme="wick"] .ybar{background:rgba(0,0,0,.4)}
:root[data-theme="wick"] .dot{--gc:rgba(253,119,2,.8)}
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
html{background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:24px 22px 120px}
.mono{font-family:'Space Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}
.tl{display:flex;align-items:center;gap:12px}
.mono#clock,.hclock{font-variant-numeric:tabular-nums}
.back{background:none;border:0;color:var(--fg);font:inherit;padding:0;cursor:pointer}
h1{font-size:44px;font-weight:500;letter-spacing:-.04em;margin:0 0 28px;line-height:1}
.home a{display:block;font-size:46px;font-weight:500;letter-spacing:-.045em;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.home a:last-child{border-bottom:1px solid var(--line)}
.home a:first-child{border-bottom:1px solid var(--line)}
.exploit{color:var(--acc)}
.home .amp{font-size:46px;font-weight:500;letter-spacing:-.045em;padding:14px 0;color:var(--mute);cursor:default;user-select:none;-webkit-user-select:none}
.home a small{font-family:'Space Mono',monospace;font-size:11px;color:var(--mute);letter-spacing:.04em;margin-left:8px;vertical-align:top}
.count{font-size:14px;letter-spacing:-.02em;margin-bottom:12px}
.count b{font-size:22px;font-weight:500;letter-spacing:-.03em}
.bar{height:8px;background:#000;border:1px solid var(--line);margin-bottom:28px;overflow:hidden}
.sechead{border-top:1px solid var(--line);padding:16px 0 2px;margin-top:14px;cursor:pointer}
.sl{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ttl{font-size:28px;font-weight:500;letter-spacing:-.035em}
.chev{display:inline-block;transition:transform .2s;margin-left:6px;font-size:14px}
.chev.up{transform:rotate(180deg)}
.sechead .bar{margin-bottom:16px}
.secbody{margin-bottom:20px}
.sechead.fixed{cursor:default}
body{touch-action:pan-y}
#stage{position:relative}
#date{cursor:pointer}
:root{--yglow:rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){:root{--yglow:rgba(255,255,255,.24)}}
.year{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:4px}
.ypct{font-size:76px;font-weight:500;letter-spacing:-.05em;line-height:1}
.ypct small{font-size:28px;margin-left:4px;color:var(--mute);letter-spacing:0}

.xpv,.xpb textarea{display:block;width:100%;min-height:270px;max-height:62vh;overflow:auto;background:transparent;border:0;padding:0;font:17px/1.4 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.01em;color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere;resize:none;margin:0;border-radius:0;outline:0}

.dpn{display:flex;gap:2px;margin-left:auto;margin-right:6px}.dpn button{border:0;background:none;color:var(--fg);font:300 22px/1 'Space Grotesk',sans-serif;padding:0 8px;cursor:pointer}
#dpw{position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:22px}

.sheet button.go.off{opacity:.3;pointer-events:none}
#smsg{color:var(--red);font-size:14px;margin-top:10px;min-height:0}
</style>
</head>
<body>
<div id="xpw"><div class="xp"><div class="xpt"><span id="xpn"></span><button class="xpx" id="xpc" aria-label="Close">✕</button></div><div class="xpb" id="xpbody"></div></div></div>
<div id="dpw"><div class="xp"><div class="xpt"><span id="dpm"></span><span class="dpn"><button id="dpp" aria-label="Previous">‹</button><button id="dpx" aria-label="Next">›</button></span><button class="xpx" id="dpc" aria-label="Close">✕</button></div><div class="xpb" id="dpbody"></div></div></div>

</div></div>

  </div>

</div></div>
<script>
var IC={
yt:'<svg viewBox="0 0 24 24"><rect x="1" y="5" width="22" height="14" rx="4" fill="#f00"/><path d="M10 9l5 3-5 3z" fill="#fff"/></svg>',
dbx:'<svg viewBox="0 0 24 24"><path fill="#0061ff" d="M6 2l6 3.9L6 9.8 0 5.9zm12 0l6 3.9-6 3.9-6-3.9zM0 13.7l6-3.9 6 3.9-6 3.9zm18-3.9l6 3.9-6 3.9-6-3.9zM6 18.8l6-3.9 6 3.9-6 3.9z"/></svg>',
bs:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="#e8312f"/><path d="M8 6h5a3 3 0 0 1 1.6 5.5A3.3 3.3 0 0 1 13 18H8z M10.4 8.3v2.4H13a1.2 1.2 0 0 0 0-2.4z M10.4 12.8v2.9H13a1.45 1.45 0 0 0 0-2.9z" fill="#fff" fill-rule="evenodd"/></svg>'};
var KEY='intentional-v1', LIM={books:3,movies:4,games:4}, S={conns:[],logs:[],todos:[],beats:[],samples:[],libs:[],albums:[],games:[],books:[],movies:[],mind:[],u:0}, view='home', open={}, ref=null, adding=null;
var ORD0={media:['books','movies','games','albums'],catalog:['libs','samples','beats']};
function norm(){if(!S.ord||typeof S.ord!='object')S.ord={};Object.keys(ORD0).forEach(function(k){var a=Array.isArray(S.ord[k])?S.ord[k].filter(function(x){return ORD0[k].indexOf(x)>=0}):[];ORD0[k].forEach(function(x){if(a.indexOf(x)<0)a.push(x)});S.ord[k]=a});if(!S.hid||typeof S.hid!='object')S.hid={};Object.keys(ORD0).forEach(function(k){S.hid[k]=Array.isArray(S.hid[k])?S.hid[k].filter(function(x){return ORD0[k].indexOf(x)>=0}):[]});if(S.logs)S.logs=S.logs.filter(function(l){return !l.demo});['beats','samples','libs','albums','games','books','movies','mind','conns','logs','todos'].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]})}
try{var l=JSON.parse(localStorage.getItem(KEY));if(l&&l.beats)S=l}catch(e){}
norm();
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ds(ts){var d=new Date(ts),m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y}
function today(){return ds(Date.now())}
function byField(it,ph){return '<input class="t" data-f="by" placeholder="'+ph+'" value="'+esc(it.by)+'" style="margin-bottom:14px">'}
function endDate(b){var s=0,L=(b.log||[]).slice().sort(function(a,c){return a.d<c.d?-1:a.d>c.d?1:0});for(var i=0;i<L.length;i++){s+=L[i].p;if(s>=b.pages)return L[i].d}return ''}
function fd(s){if(!s)return '—';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2)}
function save(){S.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(ref){try{ref.set({json:JSON.stringify(S),u:S.u}).catch(function(){})}catch(e){}}}
function setDate(){$('date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit'}).replace(/,/g,'')}
function chip(cls,label,on,act,icon){return '<button class="chip '+cls+(on?' on':'')+'" data-act="'+act+'">'+(icon||'')+label+'</button>'}
function made(arr,wk){var n=new Date(),s=wk?new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)).getTime():new Date(n.getFullYear(),n.getMonth(),1).getTime();return arr.filter(function(b){return b.t>=s}).length}
function stat(arr,lbl,wk){return '<div class="count"><b>'+made(arr,wk)+'</b> '+lbl+' created this '+(wk?'week':'month')+'</div>'}
function monthCount(){var n=new Date();return S.beats.filter(function(b){var d=new Date(b.t);return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear()}).length}
function read(b){return (b.log||[]).reduce(function(a,x){return a+x.p},0)}
function bookDone(b){return b.pages>0&&read(b)>=b.pages}
function clrBtn(k){var a=S[k];return a.length>=LIM[k]&&a.every(function(x){return isFin(k,x)})?'<div class="chips"><button class="chip gen" data-clr="'+k+'">Clear all '+LIM[k]+' · logged on Sunday</button></div>':''}
function active(k){return S[k].length}
function row(list,it){
 var o=open[it.id],h='<div class="row'+(o?' open':'')+'" data-id="'+it.id+'" data-l="'+list+'"><div class="head" data-act="tog"><span class="dot'+((list=='books'?bookDone(it):list=='movies'?!!it.date:list=='libs'?it.out:it.done)?' on':'')+'"></span><span class="nm'+((list=='mind'&&it.done)?' dn':'')+'">'+esc(it.name)+'<span class="by">'+esc(list=='samples'?libName(it.lib):it.by)+'</span></span><span class="mono">';
 if(list=='books')h+=read(it)+'/'+it.pages+' p';
 else if(list=='libs')h+=pct(it)+'%';
 else if(list=='games')h+=it.done?fd(it.end)+(it.rating!=null?' · '+it.rating+'/5':''):'in progress';
 else if(list=='albums')h+=(it.songs||[]).length+((it.songs||[]).length==1?' song':' songs');
 else if(list=='movies')h+=it.date?fd(it.date)+(it.rating?' · '+it.rating+'/5':''):'to watch';
 else h+=fd(ds(it.t)).slice(0,5);
 h+='</span></div>';
 if(list=='books')h+='<div class="bar sm"><i style="width:'+Math.min(100,it.pages?read(it)/it.pages*100:0)+'%"></i></div>';
 if(list=='libs')h+='<div class="bar sm"><i style="width:'+pct(it)+'%"></i></div>';
 h+='<div class="more">';
 if(list=='beats'){
  h+='<div class="chips">'+chip(it.done?'green':'red',it.done?'Complete':'Unfinished',true,'done')+chip('yt','YouTube',it.yt,'yt',IC.yt)+chip('dbx','Dropbox',it.dbx,'dbx',IC.dbx)+chip('bs','BeatStars',it.bs,'bs',IC.bs)+chip('gen','Stems available',it.stems,'stems')+'</div>';
 }else if(list=='samples'){
  if(S.libs.length)h+='<div class="mono">Library</div><div class="chips">'+S.libs.map(function(L){return '<button class="chip gen'+(it.lib==L.id?' on':'')+'" data-act="lib" data-v="'+L.id+'">'+esc(L.name)+'</button>'}).join('')+'</div>';
  h+='<div class="chips">'+chip('dbx','In '+folder(it),it.dbx,'dbx',IC.dbx)+chip(it.done?'green':'red',it.done?'Complete':'Unfinished',true,'done')+chip('gen','Stems available',it.stems,'stems')+'</div>';
 }else if(list=='games'){
  h+='<div class="chips">'+chip(it.done?'green':'red',it.done?'Completed':'In progress',true,'done')+'</div><div class="mono">Started</div><input class="t" type="text" readonly inputmode="none" data-dp="1" placeholder="—" data-f="start" value="'+esc(it.start||ds(it.t))+'" style="margin-bottom:14px">'+(it.done?'<div class="mono">Completed</div><input class="t" type="text" readonly inputmode="none" data-dp="1" placeholder="—" data-f="end" value="'+esc(it.end)+'" style="margin-bottom:14px">':'')+'<div class="mono">Rating</div><div class="rate">'+[0,1,2,3,4,5].map(function(n){return '<button data-act="grate" data-v="'+n+'" class="'+(it.rating!=null&&((n>0&&it.rating>=n)||(n==0&&it.rating==0))?'on':'')+'">'+n+'</button>'}).join('')+'</div>';
 }else if(list=='albums'){
  h+='<div class="chips">'+chip(it.done?'green':'red',it.done?'Listened':'Not listened yet',true,'done')+'</div>';
  h+=(it.songs||[]).map(function(x){return '<div class="song"><div class="sname">'+esc(x.name)+(x.ts?' <span class="mono">'+esc(x.ts)+'</span>':'')+'</div>'+(x.took?'<div class="stook">'+esc(x.took)+'</div>':'')+'<button class="del" data-act="sdel" data-sid="'+x.id+'">Remove</button></div>'}).join('');
  h+='<button class="addi" data-act="insp"><span class="pls'+(inspOpen[it.id]?' open':'')+'"></span>Add inspiration</button>';
  if(inspOpen[it.id])h+='<div class="inspform"><input class="t" data-sn placeholder="Song" autocomplete="off"><div class="chips" style="margin:10px 0 2px">'+['Drums','Melody','Lead','Bass','Chords','Vocals','Mix technique','Sound design'].map(function(w){return '<button class="chip gen" data-act="tk" data-v="'+w+'">'+w+'</button>'}).join('')+'</div><input class="t" data-st placeholder="What I took from it" autocomplete="off"><input class="t" data-sts placeholder="Timestamp (optional), e.g. 1:32" autocomplete="off" style="margin-top:4px"><div class="pair" style="margin-top:12px"><button data-act="song">Add song</button></div></div>';
 }else if(list=='libs'){
  var dt=daysTo(it.rel),pc=pct(it);
  h+='<div class="chips">'+chip(it.art?'green':'red',it.art?'Artwork ready':'Artwork not ready',true,'art')+chip(it.out?'green':'red',it.out?'Released':'Unreleased',true,'out')+'</div>';
  h+='<div style="font-size:18px;letter-spacing:-.02em;margin:2px 0 16px;color:'+(!it.out&&dt!=null&&dt<0?'var(--red)':'inherit')+'">'+(it.out?'Released':dayText(dt))+'</div>';
  h+='<div class="mono">Release date</div><div style="font-size:16px;margin:4px 0 14px">'+fd(it.rel)+'</div>';
  h+='<div class="mono">Compositions planned</div><input class="t" type="number" inputmode="numeric" min="1" data-f="total" value="'+esc(it.total)+'" style="margin-bottom:14px">';
  h+='<div class="count" style="margin-bottom:6px"><b>'+pc+'%</b> complete</div><div class="bar" style="margin:0 0 6px"><i style="width:'+pc+'%"></i></div>';
 }else if(list=='books'){
  h+=byField(it,'Author')+'<div class="mono">Started</div><input class="t" type="text" readonly inputmode="none" data-dp="1" placeholder="—" data-f="start" value="'+esc(it.start||ds(it.t))+'" style="margin-bottom:14px">'+(bookDone(it)?'<div class="mono" style="color:var(--green);margin-bottom:14px">Finished · '+fd(endDate(it))+'</div>':'');
  h+='<div class="pair"><label><span class="mono">Date</span><input class="t" type="text" readonly inputmode="none" data-dp="1" placeholder="—" data-ld value="'+today()+'"></label><label><span class="mono">Page you’re on</span><input class="t" type="number" inputmode="numeric" min="1" max="'+it.pages+'" data-lp placeholder="'+read(it)+'"></label><button data-act="log">Log</button></div>';
  h+=(it.log||[]).slice().reverse().map(function(x,i){return '<div class="log"><span>'+fd(x.d)+'</span><span>'+x.p+' pages</span></div>'}).join('');
  h+='<div class="mono" style="margin-top:10px">'+read(it)+' of '+it.pages+' pages</div>';
 }else if(list=='movies'){
  h+=byField(it,'Director')+'<div class="mono">Date watched</div><input class="t" type="text" readonly inputmode="none" data-dp="1" placeholder="—" data-f="date" value="'+esc(it.date)+'" style="margin-bottom:14px"><div class="mono">Rating</div><div class="rate">'+[1,2,3,4,5].map(function(n){return '<button data-act="rate" data-v="'+n+'" class="'+(it.rating>=n?'on':'')+'">'+n+'</button>'}).join('')+'</div>';
 }else{
  h+='<div class="chips">'+chip(it.done?'green':'red',it.done?'Done':'Not yet',true,'done')+'</div>';
 }
